  - id: upstream-waza-only
    source: "Sergio 2026-10-08: only waza; C1 Construct precedent"
    cmd: |
      python3 -c "
      import json, os, re
      from pathlib import Path
      r = Path(os.environ['PKG_subject'])
      own = {'waza-authoring', 'waza-evaluation', 'waza-evaluation-adversarial-v1'}
      files = [r/'SKILL.md', r/'apm.yml', r/'apm.lock.yaml', r/'AGENTS.md', r/'CONTRIBUTING.md', r/'README.md', r/'CHANGELOG.md']
      files += sorted(p for p in (r/'references').rglob('*') if p.is_file())
      files += sorted(p for p in (r/'.github').rglob('*') if p.is_file())
      suite = r/'references/scenarios/waza-evaluation-adversarial-v1.yaml'
      ids = sorted(set(re.findall(r'(?m)^  - id: ([a-z0-9-]+)', suite.read_text())), key=len, reverse=True)
      wrapper = re.compile(r'\bwaza-[a-z][a-z0-9-]*')
      bad = []
      for p in files:
          text = p.read_text(errors='replace')
          for i in ids:
              text = re.sub(r'(?<![a-z0-9-])' + re.escape(i) + r'(?![a-z0-9-])', ' ', text)
          for m in wrapper.finditer(text):
              if m.group(0) not in own:
                  bad.append(p.relative_to(r).as_posix() + ': ' + m.group(0))
      print(json.dumps({'ok': True} if not bad else {'ok': False, 'bad': bad}))
      "
    expect: {ok: true}
