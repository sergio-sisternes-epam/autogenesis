  - id: scenarios-parse
    source: "Inventory 2026-10-08: two scenario files are not valid YAML"
    cmd: |
      python3 -c "
      import json, os, re
      from pathlib import Path
      r = Path(os.environ['PKG_subject'])/'references/scenarios'
      i = json.loads((r/'suite-index.json').read_text())
      key = re.compile(r'^\s*(?:-\s+)?[A-Za-z_][A-Za-z0-9_-]*:(?:\s|\Z)')
      bad = []
      for f in i['current']:
          lines = (r/f).read_text().splitlines()
          if not any(l.startswith('id: ') for l in lines) or 'smokes:' not in lines or '\t' in '\n'.join(lines):
              bad.append(f + ': shape')
              continue
          block = None
          for n, l in enumerate(lines, 1):
              ind = len(l) - len(l.lstrip(' '))
              if block is not None and l.strip():
                  if ind > block:
                      continue
                  if not key.match(l):
                      bad.append(f + ':' + str(n) + ': under-indented block scalar line')
                  block = None
              m = re.match(r'^(\s*)(?:-\s+)?[A-Za-z_]+:\s*[|>][-+]?\s*\Z', l)
              if m:
                  block = len(m.group(1))
          body = '\n'.join(lines[lines.index('smokes:') + 1:])
          ids = re.findall(r'(?m)^  - id: \S', body)
          if not ids or any(len(re.findall(r'(?m)^    ' + k + r':', body)) < len(ids) for k in ('cmd', 'expect')):
              bad.append(f + ': smoke without id, cmd or expect')
      print(json.dumps({'ok': True} if not bad else {'ok': False, 'bad': bad}))
      "
    expect: {ok: true}
  - id: suite-not-shipped
    source: "Evaluator run 2026-10-08: APM 0.30.0 ships every path except .apm/, so evals/ reached the installed skill"
    cmd: |
      python3 -c "
      import json, os, re
      from pathlib import Path
      r = Path(os.environ['PKG_subject'])
      bad = []
      if (r/'evals').exists():
          bad.append('root evals/ would ship in the installed skill')
      if not (r/'.apm/evals/autogenesis/eval.yaml').is_file():
          bad.append('missing .apm/evals/autogenesis/eval.yaml')
      w = (r/'.waza.yaml').read_text() if (r/'.waza.yaml').is_file() else ''
      if not re.search(r'(?m)^paths:[ \t]*\n(?:[ \t]+\S.*\n)*?[ \t]+evals:[ \t]*\.apm/evals[ \t]*$', w):
          bad.append('.waza.yaml does not set paths.evals: .apm/evals')
      print(json.dumps({'ok': True} if not bad else {'ok': False, 'bad': bad}))
      "
    expect: {ok: true}
