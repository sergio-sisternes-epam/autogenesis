id: waza-evaluation-adversarial-v1
kind: skill-discipline
version: "1"
work_id: 2026-10-08-waza-evaluation
adversarial: true
description: >
  Successor to specify-only-adversarial-v2. Autogenesis designs and authors
  plain upstream Waza eval suites and never runs suite tasks against an agent
  or makes a model call for evaluation. Only the model-free validity
  allowlist V1-V3 may run, with the update check off and Waza pinned at
  0.38.9. The agent-spec/Gherkin gate is retired with a diagnostic, not an
  alias. Phase 1 contract cutover only; the dogfood suite is out of scope
  except that suite-not-shipped keeps it out of the installed package.
packages:
  - id: subject
    root: "<candidate-root>"
    mode: mount
project:
  seed_knowledge: []
smokes:
  - id: autogenesis-never-runs-suite-tasks
    source: "Sergio 2026-10-08 01:06 BST: design, not run"
    cmd: |
      python3 -c "
      import json, os, re
      from pathlib import Path
      r = Path(os.environ['PKG_subject'])
      live = [r/'SKILL.md'] + sorted(p for p in (r/'references').rglob('*.md') if 'scenarios' not in p.relative_to(r/'references').parts)
      forbid = re.compile(r'(?i)\b(never|not|no|forbid|forbids|forbidden|out of scope)\b')
      bad = []
      for p in live:
          for n, line in enumerate(p.read_text().splitlines(), 1):
              if re.search(r'\bwaza\s+run\b', line) and not forbid.search(line):
                  bad.append(p.relative_to(r).as_posix() + ':' + str(n))
      print(json.dumps({'ok': True} if not bad else {'ok': False, 'bad': bad}))
      "
    expect: {ok: true}
  - id: no-model-calling-waza-commands
    source: "Sergio 2026-10-08 01:10 BST: no model calls, no --semantic; N6 closed allowlist"
    cmd: |
      python3 -c "
      import json, os, re
      from pathlib import Path
      r = Path(os.environ['PKG_subject'])
      live = [r/'SKILL.md'] + sorted(p for p in (r/'references').rglob('*.md') if 'scenarios' not in p.relative_to(r/'references').parts)
      forbid = re.compile(r'(?i)\b(never|not|no|forbid|forbids|forbidden|out of scope)\b')
      sub = re.compile(r'\bwaza\s+(--version|[a-z][a-z-]*)(?:\s+([a-z][a-z-]*))?')
      grade_cmd = re.compile(r'\bwaza\s+grade\s+[<A-Za-z0-9_./-]')
      bad = []
      for p in live:
          for n, line in enumerate(p.read_text().splitlines(), 1):
              where = p.relative_to(r).as_posix() + ':' + str(n)
              forbidden_line = bool(forbid.search(line))
              for m in sub.finditer(line):
                  name, nxt = m.group(1), m.group(2)
                  allowed = name in ('check', 'grade', '--version') or (name == 'spec' and nxt == 'verify')
                  if not allowed and not forbidden_line:
                      bad.append(where + ' waza ' + name)
              if re.search(r'--semantic|--judge-model', line) and not forbidden_line:
                  bad.append(where + ' model flag')
              if grade_cmd.search(line) and '--task' not in line and not forbidden_line:
                  bad.append(where + ' grade without --task')
      g = ' '.join((r/'references/waza-authoring.md').read_text().split())
      if not ('left_to_runner' in g and 'any \x60prompt\x60 grader is never graded by Autogenesis' in g):
          bad.append('guide: prompt-grader tasks not left to the runner')
      print(json.dumps({'ok': True} if not bad else {'ok': False, 'bad': bad}))
      "
    expect: {ok: true}
  - id: waza-update-check-off
    source: "Sergio 2026-10-08 01:10 BST: update check off; N7"
    cmd: |
      python3 -c "
      import json, os, re
      from pathlib import Path
      r = Path(os.environ['PKG_subject'])
      live = [r/'SKILL.md'] + sorted(p for p in (r/'references').rglob('*.md') if 'scenarios' not in p.relative_to(r/'references').parts)
      cmd = re.compile(r'\bwaza\s+(?:check\s+[<A-Za-z0-9_./-]|spec\s+verify\s+-|grade\s+[<A-Za-z0-9_./-]|--version)')
      seen, bad = 0, []
      for p in live:
          for n, line in enumerate(p.read_text().splitlines(), 1):
              if cmd.search(line):
                  seen += 1
                  if 'WAZA_NO_UPDATE_CHECK=1' not in line:
                      bad.append(p.relative_to(r).as_posix() + ':' + str(n))
      ok = seen >= 4 and not bad
      print(json.dumps({'ok': True} if ok else {'ok': False, 'seen': seen, 'bad': bad}))
      "
    expect: {ok: true}
