      r = Path(os.environ['PKG_subject'])
      bad = []
      for rel in ('references/modules/workflow-discipline/SKILL.md', 'references/modules/design/SKILL.md', 'references/modules/initialise/SKILL.md', 'references/modules/workflow-discipline/references/invocation-contract.md'):
