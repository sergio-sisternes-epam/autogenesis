    root: "<candidate-root>"
    mode: mount
project:
  seed_knowledge: []
smokes:
  - id: draft-admission-and-ontology
    source: "Genesis S1/S3 and composition-substrate MODULE; existing pattern admission"
    cmd: |
      cd "$PKG_subject" &&
      grep -Fq 'status: draft' references/modules/patterns/references/parent-routed-skill-module.md &&
      grep -Fq 'not an upstream ID reservation' references/modules/patterns/references/parent-routed-skill-module.md &&
      printf '{"ok":true}\n'
