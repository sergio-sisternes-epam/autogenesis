  - id: ownership-and-no-false-authority
    source: "Agent Skills specification; B17 and Autogenesis protected invocation context"
    cmd: |
      cd "$PKG_subject" &&
      grep -Fq 'One public catalogue identity' references/modules/patterns/references/parent-routed-skill-module.md &&
      grep -Fq 'not approval or execution evidence' references/modules/patterns/references/parent-routed-skill-module.md &&
      printf '{"ok":true}\n'
    expect: {ok: true}
  - id: no-premature-split
    source: "Genesis R1 PREMATURE SPLIT and C1 EAGER BLOAT"
    cmd: |
      cd "$PKG_subject" &&
      grep -Fq 'Do not split a short single-purpose procedure' references/modules/patterns/references/parent-routed-skill-module.md &&
      printf '{"ok":true}\n'
    expect: {ok: true}
