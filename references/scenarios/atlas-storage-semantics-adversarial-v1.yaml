id: atlas-storage-semantics-adversarial-v1
kind: skill-discipline
version: "1"
work_id: 2026-09-05-atlas-storage-semantics
adversarial: true
description: >
  Reject legacy skill-local Atlas storage and require active-repository
  mount, resolve, write-home, and fail-closed behavior.
packages:
  - id: subject
    root: /home/workdir/artifacts/construct-fixtures/atlas-storage-semantics-adversarial-v1-subject
    mode: mount
project:
  seed_knowledge: []
smokes:
  - id: canonical-gitlink-path
    source: Atlas v0.8.13 migrate and mount contracts
    cmd: >
      grep -q "path = .atlas/github.com/sergio-sisternes-epam/autogenesis-atlas"
      "$PKG_subject/.gitmodules" &&
      git -C "$PKG_subject" ls-files -s
      .atlas/github.com/sergio-sisternes-epam/autogenesis-atlas |
      grep -q "^160000" && echo '{"ok":true}'
    expect:
      ok: true

  - id: mesh-matches-gitlink
    source: Atlas mesh and resolve contract
    cmd: |
      python3 -c "import configparser,json,os; from pathlib import Path; p=Path(os.environ['PKG_subject']); d=json.loads((p/'atlas-mesh.json').read_text()); s=d['stores'][0]; c=configparser.ConfigParser(); c.read(p/'.gitmodules'); g=c['submodule \".atlas/github.com/sergio-sisternes-epam/autogenesis-atlas\"']; print(json.dumps({'ok':s['id']=='github.com/sergio-sisternes-epam/autogenesis-atlas' and s['path']==g['path']=='.atlas/github.com/sergio-sisternes-epam/autogenesis-atlas' and s['ref']==g['branch']=='main'}))"
    expect:
      ok: true

  - id: atlas-directory-is-trackable
    source: Atlas migrate contract requires the new gitlink not be ignored
    cmd: >
      ! grep -Eq '^[[:space:]]*\.atlas/?[[:space:]]*$'
      "$PKG_subject/.gitignore" && echo '{"ok":true}'
    expect:
      ok: true

  - id: legacy-live-instructions-absent
    source: no split authority and Atlas write-home rule
    cmd: |
      python3 -c "import json,os,re; from pathlib import Path; p=Path(os.environ['PKG_subject']); files=[p/'SKILL.md',p/'references/modules/workflow-discipline.md',p/'references/modules/patterns/activation-card.md',p/'references/modules/think-ramble.md',p/'references/modules/validate-okf-conformance.md',p/'references/paths/research.md',p/'references/paths/learn-skill.md',p/'references/run-record-template.md']; bad=re.compile(r'--target references/atlas|atlas_root: <subject>/references/atlas|subject_atlas = <subject>/references/atlas'); print(json.dumps({'ok':not any(bad.search(f.read_text()) for f in files)}))"
    expect:
      ok: true

  - id: mount-resolve-contract-is-explicit
    source: Atlas mount path and deterministic root resolution
    cmd: |
      python3 -c 'import json,os; from pathlib import Path; t=(Path(os.environ["PKG_subject"])/"references/modules/workflow-discipline.md").read_text(); need=["active git root","no `--target`","atlas resolve <atlas_id>","SCHEMA.json"]; print(json.dumps({"ok":all(x in t for x in need)}))'
    expect:
      ok: true

  - id: no-silent-fallback
    source: Autogenesis G2/G8 and Atlas write-home rule
    cmd: |
      python3 -c "import json,os; from pathlib import Path; t=(Path(os.environ['PKG_subject'])/'references/modules/workflow-discipline.md').read_text().lower(); print(json.dumps({'ok':'fail' in t and 'closed' in t and 'never select by order' in t and 'silent fallback' in t}))"
    expect:
      ok: true

  - id: no-dual-write-compatibility
    source: single-writer principle and canonical Atlas memory decision
    cmd: |
      python3 -c "import json,os; from pathlib import Path; t=(Path(os.environ['PKG_subject'])/'references/modules/workflow-discipline.md').read_text().lower(); print(json.dumps({'ok':'no symlink, copy, dual-write' in t}))"
    expect:
      ok: true

  - id: substrate-loading-preserved
    source: multi-harness skill chaining contract
    cmd: |
      python3 -c "import json,os; from pathlib import Path; p=Path(os.environ['PKG_subject']); t=(p/'SKILL.md').read_text()+(p/'references/modules/workflow-discipline.md').read_text(); print(json.dumps({'ok':'multi-harness substrate contract' in t and 'references/paths/mount.md' in t}))"
    expect:
      ok: true

  - id: workflow-gates-preserved
    source: Autogenesis Enter Change Exit and work_id contracts
    cmd: |
      python3 -c "import json,os; from pathlib import Path; t=(Path(os.environ['PKG_subject'])/'references/modules/workflow-discipline.md').read_text(); need=['## Change (blocking)','## Exit (blocking)','work_id lineage','atlas compile']; print(json.dumps({'ok':all(x in t for x in need)}))"
    expect:
      ok: true

  - id: release-surfaces-match
    source: release identity gate
    cmd: |
      python3 -c "import json,os,re; from pathlib import Path; p=Path(os.environ['PKG_subject']); skill=re.search(r'^version: ([0-9.]+)$',(p/'SKILL.md').read_text(),re.M).group(1); apm=re.search(r'^version: ([0-9.]+)$',(p/'apm.yml').read_text(),re.M).group(1); print(json.dumps({'ok':skill==apm=='0.4.0' and '## 0.4.0' in (p/'CHANGELOG.md').read_text()}))"
    expect:
      ok: true
