name: Autogenesis CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_revision:
        description: Exact main commit to validate before tagging
        required: false
        type: string
      package_source:
        description: Optional immutable owner/repo#ref install source
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_revision:
        description: Exact peeled release commit to validate
        required: false
        type: string
      package_source:
        description: Optional immutable owner/repo#ref install source
        required: false
        type: string
    secrets:
      APM_READ_TOKEN:
        description: Read-only token for private package and store repositories
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APM_VERSION: "0.29.0"
  APM_BUILD: "b75a02b1c"
  APM_LINUX_X64_SHA256: "53c98c50f436a8b5ac1d6a3cf443f94d29ed1e5385af52859cf1b1b512f71578"

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate candidate inputs
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          PACKAGE_SOURCE: ${{ inputs.package_source }}
        run: |
          set -euo pipefail
          if [ -n "$PACKAGE_SOURCE" ]; then
            if ! [[ "$PACKAGE_SOURCE" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[A-Za-z0-9._/-]+$ ]]; then
              echo "::error title=Invalid package source::Validation accepts only owner/repo#ref."
              exit 1
            fi
            source_ref="${PACKAGE_SOURCE##*#}"
            if ! [[ "$source_ref" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$|^[0-9a-f]{40}$ ]]; then
              echo "::error title=Mutable package source::Remote validation requires a semantic-version tag or full commit SHA."
              exit 1
            fi
            if [ -z "$CANDIDATE_REVISION" ]; then
              echo "::error title=Missing candidate revision::Remote package validation requires an exact candidate SHA."
              exit 1
            fi
          fi
          if [ -n "$CANDIDATE_REVISION" ] &&
            { [ "${#CANDIDATE_REVISION}" -ne 40 ] ||
              [[ "$CANDIDATE_REVISION" == *[!0-9a-f]* ]]; }; then
            echo "::error title=Invalid candidate revision::Release validation requires a full lowercase commit SHA."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run focused offline tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check release version surfaces
        id: release-metadata
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.sha }}
        run: |
          python3 scripts/release_readiness.py \
            --commit "$CANDIDATE_REVISION" \
            --github-output "$GITHUB_OUTPUT"

  source:
    name: APM source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-apm
        with:
          version: ${{ env.APM_VERSION }}
          build: ${{ env.APM_BUILD }}
          archive-sha256: ${{ env.APM_LINUX_X64_SHA256 }}
      - name: Audit tracked source files
        run: python3 scripts/audit_source.py --jobs 8

  dependencies:
    name: Frozen dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require private dependency credential
        env:
          APM_READ_TOKEN: ${{ secrets.APM_READ_TOKEN }}
        run: |
          if [ -z "$APM_READ_TOKEN" ]; then
            echo "::error title=Missing private read token::APM_READ_TOKEN must grant read-only access to private package dependencies."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-apm
        with:
          version: ${{ env.APM_VERSION }}
          build: ${{ env.APM_BUILD }}
          archive-sha256: ${{ env.APM_LINUX_X64_SHA256 }}
      - name: Verify exact dependency source and lock contract
        run: python3 scripts/dependency_contract.py
      - name: Replay committed dependency lock
        env:
          GITHUB_APM_PAT_SERGIO_SISTERNES_EPAM: ${{ secrets.APM_READ_TOKEN }}
        run: |
          set -euo pipefail
          before="$(sha256sum apm.lock.yaml | awk '{print $1}')"
          apm install --frozen --dry-run --target agent-skills --no-policy
          after="$(sha256sum apm.lock.yaml | awk '{print $1}')"
          if [ "$before" != "$after" ]; then
            echo "::error title=Frozen lock mutation::apm install --frozen --dry-run changed apm.lock.yaml."
            exit 1
          fi
          git diff --exit-code -- apm.yml apm.lock.yaml

  store:
    name: Atlas store validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require private store credential
        env:
          APM_READ_TOKEN: ${{ secrets.APM_READ_TOKEN }}
        run: |
          if [ -z "$APM_READ_TOKEN" ]; then
            echo "::error title=Missing private read token::APM_READ_TOKEN must grant read-only access to the private store and Atlas repositories."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
          persist-credentials: false
          submodules: recursive
          token: ${{ secrets.APM_READ_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install exact Atlas v0.9.0 CLI
        env:
          APM_READ_TOKEN: ${{ secrets.APM_READ_TOKEN }}
          ATLAS_COMMIT: 2b6659e5440886c7abbd9ad10686fa3a0100813b
          ATLAS_REPO: sergio-sisternes-epam/atlas
          ATLAS_TAG: v0.9.0
        run: |
          set -euo pipefail
          tag_ref="$(
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer $APM_READ_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$ATLAS_REPO/git/ref/tags/$ATLAS_TAG"
          )"
          tag_type="$(jq -er '.object.type' <<<"$tag_ref")"
          tag_sha="$(jq -er '.object.sha' <<<"$tag_ref")"
          if [ "$tag_type" = tag ]; then
            tag_object="$(
              curl --fail --location --silent --show-error \
                --header "Authorization: Bearer $APM_READ_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$ATLAS_REPO/git/tags/$tag_sha"
            )"
            tag_type="$(jq -er '.object.type' <<<"$tag_object")"
            tag_sha="$(jq -er '.object.sha' <<<"$tag_object")"
          fi
          if [ "$tag_type" != commit ] || [ "$tag_sha" != "$ATLAS_COMMIT" ]; then
            echo "::error title=Atlas pin mismatch::$ATLAS_REPO#$ATLAS_TAG does not peel to $ATLAS_COMMIT."
            exit 1
          fi
          cli_dir="$RUNNER_TEMP/atlas-cli"
          archive="$RUNNER_TEMP/atlas-cli.tar.gz"
          mkdir -p "$cli_dir"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $APM_READ_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$ATLAS_REPO/tarball/$ATLAS_COMMIT" \
            --output "$archive"
          tar -xzf "$archive" --strip-components=1 --directory "$cli_dir"
          python3 -m pip install -r "$cli_dir/scripts/requirements-ci.txt"
          echo "ATLAS_CLI=$cli_dir/scripts/atlas.py" >> "$GITHUB_ENV"
      - name: Verify gitlink and lint/compile store
        run: |
          python3 scripts/store_contract.py \
            --require-index \
            --atlas-cli "$ATLAS_CLI"

  consumer:
    name: Consumer install (${{ matrix.name }})
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-skills
            target: agent-skills
          - name: stable-runtimes
            target: claude,codex,copilot,cursor,gemini,grok-build,kiro,opencode,windsurf
    steps:
      - name: Require private package credential
        env:
          APM_READ_TOKEN: ${{ secrets.APM_READ_TOKEN }}
        run: |
          if [ -z "$APM_READ_TOKEN" ]; then
            echo "::error title=Missing private read token::APM_READ_TOKEN must grant read-only access to Autogenesis and its private dependencies."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-apm
        with:
          version: ${{ env.APM_VERSION }}
          build: ${{ env.APM_BUILD }}
          archive-sha256: ${{ env.APM_LINUX_X64_SHA256 }}
      - name: Install and replay in a disposable consumer
        env:
          EXPECTED_REVISION: ${{ inputs.candidate_revision }}
          GITHUB_APM_PAT_SERGIO_SISTERNES_EPAM: ${{ secrets.APM_READ_TOKEN }}
          PACKAGE_SOURCE: ${{ inputs.package_source || '.' }}
          TARGETS: ${{ matrix.target }}
        run: |
          python3 scripts/validate_consumer.py \
            --source "$PACKAGE_SOURCE" \
            --target "$TARGETS" \
            --expected-revision "$EXPECTED_REVISION"

  readiness:
    name: Release readiness decision
    needs:
      - metadata
      - source
      - dependencies
      - store
      - consumer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: needs.metadata.result == 'success'
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
          persist-credentials: false
      - name: Verify exact current main
        id: exact-main
        if: needs.metadata.result == 'success' && github.event_name != 'pull_request'
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_readiness.py \
            --commit "$CANDIDATE_REVISION" \
            --require-current-main \
            --github-output "$GITHUB_OUTPUT"
      - name: Record candidate decision
        if: always()
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.sha }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
          DEPENDENCY_RESULT: ${{ needs.dependencies.result }}
          EVENT_NAME: ${{ github.event_name }}
          EXACT_MAIN_RESULT: ${{ steps.exact-main.outcome }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          STORE_RESULT: ${{ needs.store.result }}
        run: |
          set -euo pipefail
          {
            echo "candidate_revision=$CANDIDATE_REVISION"
            echo "release_metadata=$METADATA_RESULT"
            echo "source_integrity=$SOURCE_RESULT"
            echo "dependency_graph=$DEPENDENCY_RESULT"
            echo "store_validation=$STORE_RESULT"
            echo "consumer_install=$CONSUMER_RESULT"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$METADATA_RESULT" != success ] ||
            [ "$SOURCE_RESULT" != success ] ||
            [ "$DEPENDENCY_RESULT" != success ] ||
            [ "$STORE_RESULT" != success ] ||
            [ "$CONSUMER_RESULT" != success ]; then
            echo "release_readiness_decision=blocked" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "release_readiness_decision=pr-validated" |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EXACT_MAIN_RESULT" != success ]; then
            {
              echo "release_readiness_decision=blocked"
              echo "release_readiness_reason=exact-main validation failed"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "release_readiness_decision=ready-to-tag" |
            tee -a "$GITHUB_STEP_SUMMARY"
