id: skill-change-should-trigger
name: Evolving a skill from experience triggers Autogenesis
description: >-
  Trigger (positive). Source: root description "evolve, design, review, or
  initialise agent skills from durable experience ... even when Autogenesis
  is not named". The prompt does not name Autogenesis. Pass means Autogenesis
  is invoked and the workspace matches the subject fixture except for added
  or changed regular files under the resolved store's autogenesis/plans,
  autogenesis/work and autogenesis/experiences directories, a modification of
  the three autogenesis index files, and an append to the store log.
  Symlinks and any other path still fail.
tags:
  - trigger
  - positive
  - 2026-10-08-waza-evaluation

inputs:
  prompt: |-
    Setup: this workspace is a small fixture skill repository with no remote. Run `git init -q` first if it is not yet a git repository. Its declared Atlas store (see `atlas-mesh.json`) is already checked out at `.atlas/example.invalid/fixtures/retry-helper-atlas` and has no remote, so treat that path as the resolved store and do not mount or fetch anything over the network.

    Evolve the retry-helper skill in this repository from what we learned this week: callers kept wrapping non-idempotent POST requests in retries and created duplicate orders.
  context:
    fixture: fixtures/subjects/subject

expected:
  should_trigger: true

graders:
  - name: workspace_allowlist
    type: program
    config:
      # Whole-workspace check shared by every task. program_grader.go
      # does not set cmd.Dir and does not rewrite args, so python3
      # resolves this script, and the script resolves --baseline, from
      # the Waza process working directory. The run layout copies the
      # graders directory there. See README "Run layout".
      # --allow-under permits added or changed regular files strictly
      # inside plans, work and experiences. Removals, new directories
      # and symlinks there still fail. Index files may be modified
      # and the store log may only grow. Any other difference fails.
      # Only a real root .git directory is ignored.
      command: python3
      timeout: 30
      args:
        - .apm/evals/autogenesis/graders/workspace_allowlist.py
        - --baseline
        - .apm/evals/autogenesis/fixtures/subjects/subject
        - --allow-under
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/plans
        - --allow-under
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/work
        - --allow-under
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/experiences
        - --allow-modify
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/experiences/index.md
        - --allow-modify
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/plans/index.md
        - --allow-modify
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/work/index.md
        - --allow-append
        - .atlas/example.invalid/fixtures/retry-helper-atlas/log.md
  - name: autogenesis_invoked
    type: skill_invocation
    config:
      mode: any_order
      required_skills:
        - autogenesis
