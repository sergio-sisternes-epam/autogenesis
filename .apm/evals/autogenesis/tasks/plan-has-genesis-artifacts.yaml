id: plan-has-genesis-artifacts
name: Design plan carries Genesis artefacts
description: >-
  Quality (advisory). Source rule: design G3 integrated plan rule (the plan
  must contain `## Genesis Artifacts` and state its change class) and C1-C2
  (counters answered by pins). The class check accepts a `change_class:` or
  `change-class:` key, a level-2 to level-6 "Change class" heading whose
  first non-blank line names the class (optionally as a list item), an inline
  label line (optionally a list item; label Change class / Change-class /
  Change_class, any case, optionally wrapped in ** or __ with the colon
  inside or outside the emphasis), or a whole-line markdown table row with
  optional leading whitespace. The value must be exactly `hardening`,
  `new-surface` or `new-skill`, optionally wrapped in quotes, backticks or
  emphasis. On a key, inline label or table row, only whitespace and an
  optional ` # comment` may follow. On the heading form only, the token may
  also be followed by whitespace and prose, or by `:`, `;` or `,` and then
  whitespace or the end of the line. A value that merely starts with a class,
  such as `hardening-extra`, does not pass, and prose that merely contains a
  table fragment does not pass.
  The two patterns are repeated --must-match arguments. The workspace may
  add the dated plan and work node and experience records, may modify the
  three autogenesis index files, and may add lines to the store log only at
  the end or under the first # Log heading. Left to
  the runner: Autogenesis never grades a task with a prompt grader.
tags:
  - quality
  - 2026-10-08-waza-evaluation

inputs:
  prompt: |-
    Setup: this workspace is a small fixture skill repository with no remote. Run `git init -q` first if it is not yet a git repository. Its declared Atlas store (see `atlas-mesh.json`) is already checked out at `.atlas/example.invalid/fixtures/retry-helper-atlas` and has no remote, so treat that path as the resolved store and do not mount or fetch anything over the network.

    /autogenesis design: teach the retry-helper skill to recommend jittered exponential backoff with a retry budget. Use the work_id slug retry-backoff-guidance.
  context:
    fixture: fixtures/subjects/subject

graders:
  - name: plan_has_genesis_artifacts
    type: program
    config:
      # Date-agnostic plan check. The first path is the one dated plan.
      # Both --must-match patterns are data: Genesis Artifacts, then the
      # exact change-class token in a key, heading, inline label or
      # whole-line table row. The heading form may follow that token with
      # prose; the key, inline label and table forms stay exact. Go-RE2 and
      # Python compatible: no lookaround, no backreference.
      # Default status remains the simple scalar designed.
      command: python3
      timeout: 30
      args:
        - .apm/evals/autogenesis/graders/atlas_record_check.py
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/plans/{date}-retry-backoff-guidance.md
        - --must-match
        - '(?m)^## Genesis Artifacts\s*$'
        - --must-match
        - '(?m)^(?:(?:change[_-]class:[ \t]*|(?:[-*][ \t]+)?(?:\*\*(?i:change[ _-]class)[ \t]*:\*\*|\*\*(?i:change[ _-]class)\*\*[ \t]*:|__(?i:change[ _-]class)[ \t]*:__|__(?i:change[ _-]class)__[ \t]*:|(?i:change[ _-]class)[ \t]*:)[ \t]*)(?:"(?:hardening|new-surface|new-skill)"|''(?:hardening|new-surface|new-skill)''|`(?:hardening|new-surface|new-skill)`|\*\*(?:hardening|new-surface|new-skill)\*\*|\*(?:hardening|new-surface|new-skill)\*|__(?:hardening|new-surface|new-skill)__|_(?:hardening|new-surface|new-skill)_|(?:hardening|new-surface|new-skill))(?:[ \t]+#.*)?[ \t]*$|#{2,6}[ \t]+(?i:change[ _-]class)[ \t]*\n(?:[ \t]*\n)*[ \t]*(?:[-*][ \t]+)?(?:"(?:hardening|new-surface|new-skill)"|''(?:hardening|new-surface|new-skill)''|`(?:hardening|new-surface|new-skill)`|\*\*(?:hardening|new-surface|new-skill)\*\*|\*(?:hardening|new-surface|new-skill)\*|__(?:hardening|new-surface|new-skill)__|_(?:hardening|new-surface|new-skill)_|(?:hardening|new-surface|new-skill))(?:[ \t]+.*|[:;,](?:[ \t]+.*|[ \t]*))?[ \t]*$)|^[ \t]*\|[ \t]*(?:\*\*(?i:change[ _-]class)\*\*|__(?i:change[ _-]class)__|(?i:change[ _-]class))[ \t]*\|[ \t]*(?:"(?:hardening|new-surface|new-skill)"|''(?:hardening|new-surface|new-skill)''|`(?:hardening|new-surface|new-skill)`|\*\*(?:hardening|new-surface|new-skill)\*\*|\*(?:hardening|new-surface|new-skill)\*|__(?:hardening|new-surface|new-skill)__|_(?:hardening|new-surface|new-skill)_|(?:hardening|new-surface|new-skill))(?:[ \t]+#.*)?[ \t]*\|[ \t]*$'
  - name: workspace_allowlist
    type: program
    config:
      # Whole-workspace check shared by every task. program_grader.go
      # does not set cmd.Dir and does not rewrite args, so python3
      # resolves this script, and the script resolves --baseline, from
      # the Waza process working directory. The run layout copies the
      # graders directory there. See README "Run layout".
      # --allow-dated permits one added or changed regular file whose final
      # component matches {date}, a real calendar date. --allow-under permits
      # added or changed regular files strictly inside autogenesis/experiences.
      # --allow-modify permits a change to a baseline index and rejects removal
      # or a symlink. --allow-log-entry accepts added lines only at the end,
      # or in one block directly under the first # Log heading. Every baseline
      # line must remain unchanged and in order. Any other difference fails,
      # including a change to
      # SCHEMA.json, the store index, autogenesis/index.md or decisions/.
      # Only a real root .git directory is ignored.
      command: python3
      timeout: 30
      args:
        - .apm/evals/autogenesis/graders/workspace_allowlist.py
        - --baseline
        - .apm/evals/autogenesis/fixtures/subjects/subject
        - --allow-under
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/experiences
        - --allow-dated
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/plans/{date}-retry-backoff-guidance.md
        - --allow-dated
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/work/{date}-retry-backoff-guidance.md
        - --allow-modify
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/experiences/index.md
        - --allow-modify
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/plans/index.md
        - --allow-modify
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/work/index.md
        - --allow-log-entry
        - .atlas/example.invalid/fixtures/retry-helper-atlas/log.md
  - name: pins_answer_counters
    type: prompt
    config:
      # Advisory judge. The runner chooses the judge model (a different family from the agent is recommended).
      continue_session: true
      prompt: |-
        You are grading a design plan written by an agent. Read the one dated plan file
        under .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/plans/
        whose name ends with -retry-backoff-guidance.md. The user's original request was:

        BEGIN ORIGINAL INPUT
        /autogenesis design: teach the retry-helper skill to recommend jittered exponential backoff with a retry budget. Use the work_id slug retry-backoff-guidance.
        END ORIGINAL INPUT

        Pass only if all of these hold:
        1. The plan stays faithful to the original input (jittered exponential backoff and a retry budget for retry-helper) without adding unrequested scope.
        2. The plan records at least one non-trivial counter-argument or risk.
        3. Every high-severity counter is answered by a visible pin or rejected with a rationale.
        4. The plan stops for approval and makes no claim that the change was implemented.
        Call set_waza_grade_pass if all hold; otherwise call set_waza_grade_fail and name the first failing point.
