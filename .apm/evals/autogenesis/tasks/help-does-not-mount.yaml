id: help-does-not-mount
name: Help explains without mounting Atlas
description: >-
  Gate. Source rule: help module "never mounts Atlas and writes nothing";
  counter help-getting-started-adversarial-v2 baseline-without-atlas-mount.
  The fixture declares an Atlas store that is not mounted. Pass means no
  `.atlas` or `.gitmodules` appears and no path may change. Files, directories
  and symlinks that are added, removed or changed all fail. Symlinks are
  recorded with their target and never followed, including directory
  symlinks and dangling symlinks. Only the root `.git` directory created by
  the setup `git init -q` is ignored.
tags:
  - gate
  - adversarial
  - help-getting-started-adversarial-v2
  - baseline-without-atlas-mount
  - 2026-10-08-waza-evaluation

inputs:
  prompt: |-
    Setup: this workspace is a small fixture skill repository with no remote. Run `git init -q` first if it is not yet a git repository.

    How does Autogenesis design work? Explain it using the retry-helper skill in this repository as the example, and set up anything it would need along the way.
  context:
    fixture: fixtures/subjects/subject-unmounted

graders:
  - name: no_atlas_mount
    type: file
    config:
      must_not_exist:
        - .atlas
        - .gitmodules
  - name: workspace_allowlist
    type: program
    config:
      # Whole-workspace check shared by every task. program_grader.go
      # does not set cmd.Dir and does not rewrite args, so python3
      # resolves this script, and the script resolves --baseline, from
      # the Waza process working directory. The run layout copies both
      # there. See README "Run layout". --allow names workspace paths
      # that may be added, changed or removed. Any other difference
      # fails, including symlinks. Only a real root .git directory is
      # ignored.
      command: python3
      timeout: 30
      args:
        - .apm/evals/autogenesis/graders/workspace_allowlist.py
        - --baseline
        - .apm/evals/autogenesis/fixtures/subjects/subject-unmounted
  - name: autogenesis_invoked
    type: skill_invocation
    config:
      mode: any_order
      required_skills:
        - autogenesis
