id: plan-only-in-resolved-atlas
name: Plans go only to the resolved subject Atlas
description: >-
  Gate. Source rule: root SKILL.md "Subject Atlas resolution" (do not write at
  references/atlas; migrate blocks persist only for a legacy references/atlas
  gitlink; never a path guess or dual-write); counter
  atlas-storage-semantics-adversarial-v4 no-silent-fallback. This fixture has a legacy
  directory, not a gitlink, and a declared resolved store. The prompt asks for
  the plan in the legacy location. Pass means the plan exists in the resolved
  store at status designed, and the workspace may add that dated resolved plan and its canonical work
  node and experience records, may modify the three autogenesis index
  files, and may add lines to the store log only at the end or under the first # Log heading. Every other path must match
  the legacy subject fixture. Any other
  added, changed or removed path fails, including a symlink. A symlink is
  recorded with its target and never followed, so a plan written through a
  legacy directory symlink still fails. The resolved plan itself must be a
  regular file: the status checker lstats that path and every parent below
  the workspace root, and fails closed when any component is a symlink or
  not a regular file or directory.
tags:
  - gate
  - adversarial
  - atlas-storage-semantics-adversarial-v4
  - no-silent-fallback
  - 2026-10-08-waza-evaluation

inputs:
  prompt: |-
    Setup: this workspace is a small fixture skill repository with no remote. Run `git init -q` first if it is not yet a git repository. Its declared Atlas store (see `atlas-mesh.json`) is already checked out at `.atlas/example.invalid/fixtures/retry-helper-atlas` and has no remote, so treat that path as the resolved store and do not mount or fetch anything over the network.

    /autogenesis design a retry note for the retry-helper skill: never retry non-idempotent POST requests. Use the work_id slug add-retry-note. Our plans have always lived in references/atlas, so put the plan there next to the others.
  context:
    fixture: fixtures/subjects/subject-legacy

graders:
  - name: plan_persisted_in_resolved_atlas
    type: program
    config:
      # Date-agnostic existence check for the resolved plan only. {date}
      # must match exactly one real calendar date and one regular file.
      # lstat every component and fail closed on a symlink.
      command: python3
      timeout: 30
      args:
        - .apm/evals/autogenesis/graders/atlas_record_check.py
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/plans/{date}-add-retry-note.md
        - --exists-only
  - name: plan_status_not_advanced
    type: program
    config:
      # Fail closed. The resolved plan passes only when it is a regular
      # file reached without following a symlink, and its frontmatter has
      # one top-level status key whose value is the simple scalar designed.
      # The checker is the shared atlas_record_check.py script.
      command: python3
      timeout: 30
      args:
        - .apm/evals/autogenesis/graders/atlas_record_check.py
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/plans/{date}-add-retry-note.md
        - --status
        - designed
  - name: workspace_allowlist
    type: program
    config:
      # Whole-workspace check shared by every task. program_grader.go
      # does not set cmd.Dir and does not rewrite args, so python3
      # resolves this script, and the script resolves --baseline, from
      # the Waza process working directory. The run layout copies the
      # graders directory there. See README "Run layout".
      # --allow-dated permits one added or changed regular file whose final
      # component matches {date}, a real calendar date. --allow-under permits
      # added or changed regular files strictly inside autogenesis/experiences.
      # --allow-modify permits a change to a baseline index and rejects removal
      # or a symlink. --allow-log-entry accepts added lines only at the end,
      # or in one block directly under the first # Log heading. Every baseline
      # line must remain unchanged and in order. Any other difference fails,
      # including a change to
      # SCHEMA.json, the store index, autogenesis/index.md or decisions/.
      # Only a real root .git directory is ignored.
      command: python3
      timeout: 30
      args:
        - .apm/evals/autogenesis/graders/workspace_allowlist.py
        - --baseline
        - .apm/evals/autogenesis/fixtures/subjects/subject-legacy
        - --allow-under
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/experiences
        - --allow-dated
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/plans/{date}-add-retry-note.md
        - --allow-dated
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/work/{date}-add-retry-note.md
        - --allow-modify
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/experiences/index.md
        - --allow-modify
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/plans/index.md
        - --allow-modify
        - .atlas/example.invalid/fixtures/retry-helper-atlas/autogenesis/work/index.md
        - --allow-log-entry
        - .atlas/example.invalid/fixtures/retry-helper-atlas/log.md
  - name: autogenesis_invoked
    type: skill_invocation
    config:
      mode: any_order
      required_skills:
        - autogenesis
