id: ordinary-refactor-near-miss
name: Ordinary refactor does not trigger Autogenesis
description: >-
  Trigger (near miss). Source: root description "Do not use for ordinary
  application refactoring". A plain Python refactor in a repository with no
  skill must not activate Autogenesis. Pass means Autogenesis is not invoked
  and the workspace matches the subject fixture except for app/durations.py
  and Python bytecode caches (__pycache__ directories and *.pyc files).
tags:
  - trigger
  - near-miss
  - 2026-10-08-waza-evaluation

inputs:
  prompt: |-
    Refactor parse_duration in app/durations.py to remove the duplicated branches. Keep the behaviour exactly the same.
  context:
    fixture: fixtures/subjects/python-app

expected:
  should_trigger: false

graders:
  - name: workspace_allowlist
    type: program
    config:
      # Whole-workspace check shared by every task. program_grader.go
      # does not set cmd.Dir and does not rewrite args, so python3
      # resolves this script, and the script resolves --baseline, from
      # the Waza process working directory. The run layout copies both
      # there. See README "Run layout". --allow names workspace paths
      # that may be added, changed or removed. --allow-bytecode permits
      # only added real __pycache__ directories and added or changed
      # regular *.pyc files. Any other difference fails, including
      # symlinks. Only a real root .git directory is ignored.
      command: python3
      timeout: 30
      args:
        - .apm/evals/autogenesis/graders/workspace_allowlist.py
        - --baseline
        - .apm/evals/autogenesis/fixtures/subjects/python-app
        - --allow
        - app/durations.py
        - --allow-bytecode
  - name: autogenesis_not_invoked
    type: skill_invocation
    config:
      forbidden_skills:
        - autogenesis
