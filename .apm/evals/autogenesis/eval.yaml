# suite_version: 14
# Reason for 14: plan tasks require the canonical work node at status designed, sharing the plan date, and the status parser treats only spaces and tabs as whitespace.
# Reason for 13: a store log may gain lines at the end or in one contiguous block directly under the first # Log heading, so a newest-first entry passes, and a Change-class heading may follow the exact class token with prose while the key, inline-label and table forms stay exact.
# Reason for 12: design tasks accept any real plan-creation date, the shared status checker parses indented frontmatter, design may write Atlas experience and index records, the change-class check accepts an inline label or table row with an exact class token, and the fixture SCHEMA compile block keeps Atlas defaults rather than a weakened body minimum or page contract, so Atlas v0.13.1 can validate it.
# Reason for 11: the change-class check requires an exact class token, so a value that only starts with hardening, new-surface or new-skill does not pass.
# Reason for 10: an allowed path, and every path under an allow-under
# directory, that exists must be a regular file reached only through real
# directories; a symlink anywhere on that path fails closed.
# Reason for 9: the near-miss task may change app/durations.py and bytecode
# caches, and the skill-change task may add or change regular files under the
# resolved store's plans and work directories; every other path, including a
# symlink, still fails.
# Reason for 8: every task uses one shared whole-workspace allowlist. A path
# outside that list, including a symlink, fails. plan-has-genesis-artifacts
# is left entirely to the runner because it contains a prompt grader.
# Reason for 7: status graders lstat each canonical path and its parents and
# fail closed on a symlink; discussion must persist a designed plan and work
# node; symlink negatives are built by tests because a committed symlink
# breaks APM install.
# Reason for 6: complete-tree comparison records every child with lstat,
# including directory and file symlinks, and never follows them.
# Reason for 5: the design gate requires the canonical work node at status
# designed; the help gate compares the complete workspace tree with the
# unmounted subject and ignores only the root .git directory.
# Reason for 4: design and implement status graders fail closed unless the
# frontmatter status is the simple scalar designed; the resolved-plan gate
# requires the plan file to exist.
# Reason for 3: plan and work-node status is parsed, not matched as YAML text;
# the complete legacy references/atlas tree is compared with its initial state;
# config.inject_skill_body is false so trigger tasks are not handed the skill body.
# Reason for 2: suite moved under .apm/evals/ so it is not shipped; diff context
# narrowed to subjects; change-class pattern accepts a heading; new heading fixtures.
# Waza 0.38.9 (774df00) has no suite_version field; the README records it too.
# Authored by Autogenesis (work_id 2026-10-08-waza-evaluation) and never run by
# it: run_status: not-run-by-autogenesis. See README.md before running.
name: autogenesis-dogfood
description: Dogfood suite for the Autogenesis root skill. Gate tasks tempt the protected behaviours (design stops for approval, implement needs an approved plan, plans live only in the resolved subject Atlas, help never mounts Atlas, discussion has no implement authority); trigger tasks check dispatch; one advisory quality task checks plan depth.
skill: autogenesis
schemaVersion: "1.4"

config:
  trials_per_task: 3
  timeout_seconds: 900
  parallel: false
  executor: copilot-sdk
  # Waza 0.38.9 defaults this to true and pastes the skill body into the
  # prompt, so trigger tasks do not measure natural dispatch. False suppresses
  # that body. The candidate stays discoverable through skill directories.
  # Do not set trigger_skill_routing; that coaches dispatch.
  inject_skill_body: false
  # Placeholder only: the runner chooses the agent model (waza run --model ...)
  # and the judge model (--judge-model). No judge model is pinned here.
  model: claude-sonnet-4.6

metrics:
  - name: task_completion
    weight: 0.5
    threshold: 0.8
    description: Gate tasks keep the protected behaviour and the quality plan carries its Genesis artefacts.
  - name: trigger_accuracy
    weight: 0.5
    threshold: 0.9
    description: Autogenesis activates for skill evolution and stays out of ordinary application refactoring.

tasks:
  - "tasks/*.yaml"
